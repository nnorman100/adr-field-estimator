name: Roll back to version

# Redeploys an earlier YYYY.MM.DD-N release tag to Cloud Run and Hosting through scripts/auto_deploy.py:
# checks for applied data migrations newer than the target version (emitting a warning because code
# rollback does not undo database/data changes), stages a 0% revision at the target version, runs the
# staged checks, promotes traffic, stamps and deploys only hosting:alert-disaster, and runs
# scripts/verify_hosting.js. If verification fails after promotion, traffic and Hosting are restored
# automatically.
#
# Note: The live Workload Identity provider condition in scripts/setup_auto_deploy.sh authorizes
# deploy.yml (whose workflow_dispatch also accepts a `version` input immediately without any IAM
# change) and, once scripts/setup_auto_deploy.sh is re-run by the owner, this workflow as well.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag to redeploy (YYYY.MM.DD-N, e.g. 2026.11.02-1)'
        required: true
        type: string
      check_only:
        description: 'Run refusal and migration checks only without deploying'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rollback:
    if: vars.AUTO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ROLLBACK_VERSION: ${{ inputs.version }}
      RUN_ID: ${{ github.run_id }}
      ROLLBACK_ARGS: ${{ inputs.check_only && '--check-only' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false
      - id: python
        run: echo "version=$(python3 scripts/ci_python_version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --require-hashes -r backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: alert-disaster-field-2026
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Roll back to version
        # ROLLBACK_ARGS is deliberately unquoted: empty means a live rollback to the chosen version.
        run: python3 scripts/auto_deploy.py --rollback "$ROLLBACK_VERSION" --run-id "$RUN_ID" $ROLLBACK_ARGS
