name: Test guard

# Fails a pull request that can weaken testing (deletes, skips or loosens
# tests, changes stored answers, scoring thresholds or eval files, or removes
# or disables a workflow job, step or check), unless the owner adds the
# "test-change-approved" label. Coding agents must never add it. The rules are
# in scripts/test-guard.mjs and .github/test-guard.json; see docs/RUNBOOK.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  test-guard:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: lts/*
      - name: Run the guard from the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Use the base branch's copy of the guard, so a pull request cannot
          # edit the guard to let itself through.
          if git show "$BASE_SHA:scripts/test-guard.mjs" > "$RUNNER_TEMP/test-guard.mjs" 2>/dev/null; then
            node "$RUNNER_TEMP/test-guard.mjs" "$BASE_SHA"
          else
            node scripts/test-guard.mjs "$BASE_SHA"
          fi
