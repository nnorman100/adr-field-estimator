name: CodeQL

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The JavaScript/TypeScript extractor runs node. GitHub's Ubuntu image has it; the
      # self-hosted runner's container does not.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      # Code scanning is not enabled on this private repository, so results are
      # listed in the job summary only (no artifact upload: the Actions artifact storage
      # quota is exhausted under a $0 cap). Switch upload to 'always' once it is enabled.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: never
          output: codeql-results
      - name: Summarize findings
        run: |
          count=$(jq '[.runs[].results[]?] | length' codeql-results/*.sarif)
          echo "CodeQL findings: $count" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[].results[]? | "- \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' codeql-results/*.sarif >> "$GITHUB_STEP_SUMMARY"
      # Code scanning is not on for this private repository, so nothing else reports findings: a finding
      # fails the run and master-red.yml opens "master is red: CodeQL" (docs/runbook/ci.md).
      - name: Fail on findings
        run: |
          count=$(jq -s '[.[].runs[].results[]?] | length' codeql-results/*.sarif)
          if [ "$count" -gt 0 ]; then
            echo "::error::CodeQL found $count finding(s); see the run summary."
            exit 1
          fi
