name: Web release (test)

# Releases the rebuilt app (web/) to the TEST environment in project dryscope after the Web app
# workflow passes on master: build the image and push it by digest, run the numbered migrations in
# the Cloud Run job dryscope-migrate-test (same image, by digest, running as the migrator inside
# Google), release web/firestore.rules to the field database dryscope-field-test when the file
# changed (web/scripts/release-rules.ts), stage a 0% revision of dryscope-api-test, smoke-check it
# on its own tagged URL, then move all traffic to it, putting the previous traffic back if anything
# after that fails. Then the record job tags the released commit with its version (YYYY.MM.DD-N),
# publishes a pre-release GitHub Release with manifest.json and the rollback command, or, after any
# failure past the gate, writes one error line to Cloud Logging for the failed-release alert
# (docs/plans/TC.md, TC-8). Live is not released from here. Keyless: workload identity federation from the
# dryscope-test pool, as the deploy account, which can set the image on the services and the job,
# run the job and release rules, but holds no database role and cannot delete. No job connects to
# Cloud SQL from this runner: it only calls Google APIs over HTTPS. It skips with a notice until
# the owner has finished docs/runbook/test-release.md, "Release the rebuilt app to test"; before
# the owner's first app-root apply it only pushes the first images and prints their digests.
# Images are assembled without Docker (web/scripts/build-image.sh, crane), because the runner has
# no daemon. Nothing here deletes a service, revision, job, image, ruleset or database object.
on:
  workflow_run:
    workflows: [Web app]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions: {}

# One release at a time; a newer merge waits instead of interleaving traffic moves.
concurrency:
  group: web-release-test
  cancel-in-progress: false

env:
  PROJECT: dryscope
  REGION: us-central1
  SERVICE: dryscope-api-test
  IMAGE: us-central1-docker.pkg.dev/dryscope/dryscope-test/web
  PLACEHOLDER_IMAGE: us-central1-docker.pkg.dev/dryscope/dryscope-test/live-placeholder
  # The migration job the app root creates (infra/dryscope/app/migrate_job.tf).
  JOB: dryscope-migrate-test
  # Release the commit Web app tested, not whatever master has moved to since.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  gate:
    # Only a successful push run of Web app on master in this repository, or a manual run on master.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.vars.outputs.ready }}
    steps:
      - id: vars
        env:
          PROVIDER: ${{ vars.DRYSCOPE_TEST_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.DRYSCOPE_TEST_DEPLOY_SA }}
          MIGRATE_SA: ${{ vars.DRYSCOPE_TEST_MIGRATE_SA }}
        run: |
          # Unset (setup unfinished, or the owner paused releases by deleting one) is a skip.
          if [ -z "$PROVIDER" ] || [ -z "$DEPLOY_SA" ] || [ -z "$MIGRATE_SA" ]; then
            echo "::notice title=Test release skipped::Releases to test are off: DRYSCOPE_TEST_WIF_PROVIDER, DRYSCOPE_TEST_DEPLOY_SA and DRYSCOPE_TEST_MIGRATE_SA must all be set (docs/runbook/test-release.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Set but wrong is an error, never a skip: this workflow may only reach test.
          bad=0
          [[ "$PROVIDER" =~ ^projects/570228742694/locations/global/workloadIdentityPools/dryscope-test/providers/[a-z0-9-]{4,32}$ ]] \
            || { echo "::error::DRYSCOPE_TEST_WIF_PROVIDER must be a provider in the dryscope-test pool of project 570228742694."; bad=1; }
          [ "$DEPLOY_SA" = "dryscope-deploy-test@dryscope.iam.gserviceaccount.com" ] \
            || { echo "::error::DRYSCOPE_TEST_DEPLOY_SA must be dryscope-deploy-test@dryscope.iam.gserviceaccount.com."; bad=1; }
          [ "$MIGRATE_SA" = "dryscope-migrate-test@dryscope.iam.gserviceaccount.com" ] \
            || { echo "::error::DRYSCOPE_TEST_MIGRATE_SA must be dryscope-migrate-test@dryscope.iam.gserviceaccount.com."; bad=1; }
          [ "$bad" = 0 ] || exit 1
          echo "ready=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 25
    environment: test
    permissions:
      contents: read
      id-token: write
    outputs:
      service_ready: ${{ steps.service.outputs.ready }}
      image: ${{ steps.image.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
          # The version counts every same-day tag, the old app's included.
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.DRYSCOPE_TEST_WIF_PROVIDER }}
          service_account: ${{ vars.DRYSCOPE_TEST_DEPLOY_SA }}
          project_id: dryscope
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # The deploy account can see the service only after the owner's first app-root apply. Until
      # then this run only pushes the first images, whose digests that apply needs.
      - id: service
        run: |
          if gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(metadata.name)' >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Test release skipped::$SERVICE is not visible to the deploy account yet. This run pushes the first images only; the owner applies the app root with their digests (docs/runbook/test-release.md, part D)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      # No Docker daemon on the runner: crane assembles and pushes the images (owner decision 2026-11-10).
      - name: Install crane and sign in to the registry
        run: |
          web/scripts/install-crane.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          gcloud auth print-access-token | "$RUNNER_TEMP/bin/crane" auth login us-central1-docker.pkg.dev -u oauth2accesstoken --password-stdin
      # The release version, YYYY.MM.DD-N (UTC date; N is one more than the highest tag for that date,
      # counting the old app's tags). A rerun of a commit keeps the version baked into the image it
      # already pushed, unless another commit has since been tagged with it.
      - id: version
        run: |
          if config=$(crane config "$IMAGE:$COMMIT" 2>/dev/null); then
            if ! version=$(node web/scripts/release-version.ts from-image <<<"$config"); then
              echo "::error::The image already pushed for $COMMIT carries no release version, and its tag cannot be replaced. Release a newer commit."
              exit 1
            fi
            if tagged=$(git rev-parse -q --verify "refs/tags/$version^{commit}") && [ "$tagged" != "$COMMIT" ]; then
              echo "::error::Version $version already belongs to $tagged, so the image already pushed for $COMMIT cannot be released under it. Release a newer commit."
              exit 1
            fi
            echo "Reusing release version $version from the image already pushed for $COMMIT"
          elif ! version=$(git tag --list | node web/scripts/release-version.ts next --date "$(date -u +%Y.%m.%d)"); then
            echo "::error::Could not number this release from the repository's tags."
            exit 1
          fi
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[1-9][0-9]{0,5}$ ]] \
            || { echo "::error::Unexpected release version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
      # Tags are immutable in this repository, so a rerun reuses the image already pushed for this
      # commit instead of failing on the tag.
      - id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if digest=$(crane digest "$IMAGE:$COMMIT" 2>/dev/null); then
            echo "Reusing the image already pushed for $COMMIT"
          else
            web/scripts/build-image.sh web --commit "$COMMIT" --version "$VERSION" --tag "$IMAGE:$COMMIT"
            digest=$(crane digest "$IMAGE:$COMMIT")
          fi
          ref="$IMAGE@$digest"
          [[ "$ref" =~ ^us-central1-docker\.pkg\.dev/dryscope/dryscope-test/web@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::Unexpected image reference: $ref"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Image (api_image): \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
      # Before the first app-root apply only: the Live relay placeholder image it also needs (stage S7
      # replaces the placeholder; after the apply, releases change only the web app's image).
      - id: placeholder
        if: steps.service.outputs.ready != 'true'
        run: |
          if digest=$(crane digest "$PLACEHOLDER_IMAGE:$COMMIT" 2>/dev/null); then
            echo "Reusing the placeholder already pushed for $COMMIT"
          else
            web/scripts/build-image.sh live-placeholder --tag "$PLACEHOLDER_IMAGE:$COMMIT"
            digest=$(crane digest "$PLACEHOLDER_IMAGE:$COMMIT")
          fi
          ref="$PLACEHOLDER_IMAGE@$digest"
          [[ "$ref" =~ ^us-central1-docker\.pkg\.dev/dryscope/dryscope-test/live-placeholder@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::Unexpected placeholder reference: $ref"; exit 1; }
          echo "Live relay placeholder (live_image): \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

  migrate:
    needs: build
    if: needs.build.outputs.service_ready == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 15
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_REF: ${{ needs.build.outputs.image }}
      MIGRATE_SA: ${{ vars.DRYSCOPE_TEST_MIGRATE_SA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
          sparse-checkout: web/migrations
      - id: ledger
        run: |
          if compgen -G 'web/migrations/*.sql' >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No migrations::web/migrations holds no numbered migrations at this commit; nothing to apply."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # The deploy account sets the job's image and runs it; the job itself runs as the migrator,
      # inside Google, over Cloud Run's built-in Cloud SQL connection with IAM login (no password).
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.ledger.outputs.present == 'true'
        with:
          workload_identity_provider: ${{ vars.DRYSCOPE_TEST_WIF_PROVIDER }}
          service_account: ${{ vars.DRYSCOPE_TEST_DEPLOY_SA }}
          project_id: dryscope
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.ledger.outputs.present == 'true'
      # Only the image changes. The job's account, command, settings and instance stay as the app
      # root set them, so the owner's next plan shows no drift. The job must still run as the
      # migrator and now carry this release's image, or nothing runs.
      - id: job
        if: steps.ledger.outputs.present == 'true'
        run: |
          if ! gcloud run jobs update "$JOB" --image="$IMAGE_REF" --region="$REGION" --project="$PROJECT" --quiet; then
            echo "::error::Could not set the release image on $JOB; nothing ran and traffic did not move. Check that the app root created the job (docs/runbook/test-release.md, part D) and that the data root lets the deploy account act as the migrator (part A)."
            exit 1
          fi
          state=$(gcloud run jobs describe "$JOB" --region="$REGION" --project="$PROJECT" \
            --format='value(spec.template.spec.template.spec.serviceAccountName,spec.template.spec.template.spec.containers[0].image)') \
            || { echo "::error::Could not read $JOB back after setting its image. Nothing ran."; exit 1; }
          read -r account image <<<"$state" || true
          if [ "$account" != "$MIGRATE_SA" ] || [ "$image" != "$IMAGE_REF" ]; then
            echo "::error::$JOB must run as $MIGRATE_SA with $IMAGE_REF; it has account=$account image=$image. Nothing ran."
            exit 1
          fi
      - id: migrations
        if: steps.ledger.outputs.present == 'true'
        run: |
          if ! execution=$(gcloud run jobs execute "$JOB" --region="$REGION" --project="$PROJECT" --wait --format='value(metadata.name)'); then
            echo "::error::Migrations failed before any traffic moved. Read the $JOB execution's logs in the Cloud Run console. If this is the first run, check the owner's database bootstrap grants (docs/runbook/test-release.md, part B)."
            exit 1
          fi
          echo "Migrations applied by \`$execution\` ($JOB, image \`$IMAGE_REF\`)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [build, migrate]
    if: needs.build.outputs.service_ready == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 15
    environment: test
    permissions:
      contents: read
      id-token: write
    # For the release record: the revision now serving, the traffic it replaced, and whether this
    # release's image was already serving before this run (a rerun after the traffic move).
    outputs:
      revision: ${{ steps.stage.outputs.revision }}
      previous: ${{ steps.before.outputs.previous }}
      serving: ${{ steps.before.outputs.serving }}
    env:
      IMAGE_REF: ${{ needs.build.outputs.image }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
          # The whole of web/, so web/package.json ("type": "module") governs the smoke script.
          sparse-checkout: web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.DRYSCOPE_TEST_WIF_PROVIDER }}
          service_account: ${{ vars.DRYSCOPE_TEST_DEPLOY_SA }}
          project_id: dryscope
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # The field database's browser rules (web/firestore.rules) go to dryscope-field-test only,
      # through the Firebase Rules API, before any revision or traffic changes: a ruleset that does
      # not compile, or a refused call, stops the release with nothing to undo. An unchanged file
      # creates nothing. The access token goes to the script on stdin, never in a setting.
      - id: rules
        name: Release the field-database rules
        run: |
          if ! gcloud auth print-access-token | node web/scripts/release-rules.ts --env test --file web/firestore.rules; then
            echo "::error::The field-database rules were not released and traffic did not move. A 403 means the data root's dryscopeRulesReleaseTest grant to the deploy account is not applied yet (docs/runbook/test-release.md, part A)."
            exit 1
          fi
      # The self-hosted job container is leaner than GitHub's image (docs/runbook/ci.md, "CI runners").
      - name: Install jq when missing
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
      # Remember who serves now, so a failure after the traffic move can put it back exactly.
      - id: before
        run: |
          previous=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format=json \
            | jq -r '[.status.traffic[] | select((.percent // 0) > 0) | "\(.revisionName)=\(.percent)"] | join(",")')
          [ -n "$previous" ] || { echo "::error::Could not read the current traffic of $SERVICE."; exit 1; }
          template=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" \
            --format='value(spec.template.spec.containers[0].image,status.latestReadyRevisionName)') \
            || { echo "::error::Could not read the current revision of $SERVICE."; exit 1; }
          read -r image ready <<<"$template" || true
          # A rerun after this release already took the traffic: its image is the service's, and the
          # newest ready revision serves it all.
          serving=false
          if [ "$image" = "$IMAGE_REF" ] && [ "$previous" = "$ready=100" ]; then serving=true; fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "serving=$serving" >> "$GITHUB_OUTPUT"
          echo "Serving before: \`$previous\`" >> "$GITHUB_STEP_SUMMARY"
      # Only the image changes. Service account, environment, secrets, port and access stay as the
      # app root set them, so the owner's next plan shows no drift.
      - id: stage
        run: |
          if ! gcloud run deploy "$SERVICE" --image="$IMAGE_REF" --region="$REGION" --project="$PROJECT" --no-traffic --tag=candidate --quiet; then
            echo "::error::The new revision did not become ready; traffic did not move. Check its logs, and that every dryscope-test-* secret has a version (docs/runbook/terraform-apply.md step 4)."
            exit 1
          fi
          state=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format=json)
          revision=$(jq -r '.status.traffic[] | select(.tag == "candidate") | .revisionName' <<<"$state")
          url=$(jq -r '.status.traffic[] | select(.tag == "candidate") | .url' <<<"$state")
          image=$(jq -r '.spec.template.spec.containers[0].image' <<<"$state")
          ready=$(jq -r '.status.latestReadyRevisionName' <<<"$state")
          # The candidate tag must sit on the ready revision this run just created, running this image.
          [ "$image" = "$IMAGE_REF" ] && [ "$revision" = "$ready" ] && [[ "$url" == https://* ]] \
            || { echo "::error::Staged revision check failed: candidate=$revision ready=$ready image=$image."; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged at 0%: \`$revision\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-check the staged revision
        env:
          CANDIDATE_URL: ${{ steps.stage.outputs.url }}
        run: node web/scripts/smoke-release.ts --url "$CANDIDATE_URL" --commit "$COMMIT" --version "$VERSION" --env test
      - id: promote
        env:
          REVISION: ${{ steps.stage.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --to-revisions="$REVISION=100" --region="$REGION" --project="$PROJECT" --quiet
      - name: Smoke-check the service URL
        env:
          REVISION: ${{ steps.stage.outputs.revision }}
        run: |
          url=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')
          node web/scripts/smoke-release.ts --url "$url" --commit "$COMMIT" --version "$VERSION" --env test
          echo "Serving: \`$REVISION\` at 100% for $COMMIT" >> "$GITHUB_STEP_SUMMARY"
      # The move ran (it succeeded, failed, or was cancelled midway and may have landed): put the
      # remembered traffic back; restoring a split that never changed is harmless. Before the
      # move, nothing changed for users and there is nothing to undo.
      - name: Roll back traffic
        if: (failure() || cancelled()) && (steps.promote.outcome == 'success' || steps.promote.outcome == 'failure' || steps.promote.outcome == 'cancelled')
        env:
          PREVIOUS: ${{ steps.before.outputs.previous }}
        run: |
          gcloud run services update-traffic "$SERVICE" --to-revisions="$PREVIOUS" --region="$REGION" --project="$PROJECT" --quiet
          echo "Rolled back to \`$PREVIOUS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Release failed after the traffic move; traffic is back on $PREVIOUS."

  # The release record (docs/plans/TC.md, TC-8). After a release that moved traffic and passed both
  # smoke checks: the manifest, the version tag at the released commit and a pre-release GitHub
  # Release carrying manifest.json, with the rollback command in its notes. After any failure past
  # the gate (here or in an earlier job): one ERROR line in the dryscope-release log for the
  # failed-release alert (TC-11, C11), which needs roles/logging.logWriter for the deploy account
  # (TC-9). The workflow's only write permission is this job's, and only the earlier-release lookup,
  # tag and Release steps hold the token.
  record:
    needs: [gate, build, migrate, deploy]
    if: >-
      always() && needs.gate.outputs.ready == 'true' && (
        needs.deploy.result == 'success' ||
        needs.build.result == 'failure' || needs.build.result == 'cancelled' ||
        needs.migrate.result == 'failure' || needs.migrate.result == 'cancelled' ||
        needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled'
      )
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 10
    environment: test
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.deploy.result == 'success'
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
          sparse-checkout: web
          # The manifest names the newest infra-test-<root>-* tag per Terraform root (C6).
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.deploy.result == 'success'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: needs.deploy.result == 'success'
        run: npm ci
        working-directory: web
      # The self-hosted runner's container has no gh, so install a pinned, checksum-checked release
      # (as deploy.yml does).
      - name: Install GitHub CLI
        if: needs.deploy.result == 'success'
        env:
          GH_VERSION: 2.103.2
          GH_SHA256: 62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8
        run: |
          if ! command -v gh > /dev/null; then
            archive="$RUNNER_TEMP/gh.tar.gz"
            curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
            echo "${GH_SHA256}  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          fi
      # A rerun after this release's image already took the traffic (the record failed after the
      # move): the traffic deploy remembered is this release's own, so the rollback target comes
      # from the previous published release's manifest, never from current traffic.
      - id: earlier
        if: needs.deploy.result == 'success' && needs.deploy.outputs.serving == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! last=$(gh api "repos/$GH_REPO/releases?per_page=100" | node web/scripts/release-version.ts previous --before "$VERSION"); then
            echo "::error::This release's image was already serving, and no earlier published test release with manifest.json names the revision to roll back to. Nothing was tagged or published."
            exit 1
          fi
          dir="$RUNNER_TEMP/earlier"
          mkdir -p "$dir"
          gh release download "$last" --pattern manifest.json --dir "$dir" --clobber
          echo "manifest=$dir/manifest.json" >> "$GITHUB_OUTPUT"
          echo "This release's image was already serving (a rerun): the rollback target is \`$last\`'s revision." >> "$GITHUB_STEP_SUMMARY"
      - id: manifest
        if: needs.deploy.result == 'success'
        working-directory: web
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
          REVISION: ${{ needs.deploy.outputs.revision }}
          PREVIOUS: ${{ needs.deploy.outputs.previous }}
          EARLIER: ${{ steps.earlier.outputs.manifest }}
        run: |
          git tag --list 'infra-test-*' | npx tsx scripts/release-manifest.ts --version "$VERSION" --commit "$COMMIT" \
            --image "$IMAGE_REF" --revision "$REVISION" --replaced "$PREVIOUS" --run "$RUN_URL" \
            --out "$RUNNER_TEMP/manifest.json" --notes "$RUNNER_TEMP/notes.md" ${EARLIER:+--previous-release "$EARLIER"}
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      # The version tag, at the released commit. A tag is never moved: one already on this commit (a
      # rerun) is kept, and one on another commit stops the record.
      - id: tag
        if: needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if tagged=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq '.object.sha' 2>/dev/null); then
            if [ "$tagged" != "$COMMIT" ]; then
              echo "::error::Version tag $VERSION already points to $tagged, and a tag is never moved. Release a newer commit."
              exit 1
            fi
            echo "Version tag $VERSION is already at $COMMIT"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$VERSION" -f sha="$COMMIT" --silent
            echo "Tagged \`$VERSION\` at $COMMIT" >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: release
        if: needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # An existing Release is kept only when it is complete: published, a pre-release, with
        # manifest.json and this release's rollback command in its notes. An incomplete one (a draft
        # left by an interrupted create, say) is finished with this run's manifest and notes.
        run: |
          if existing=$(gh release view "$VERSION" --json isDraft,isPrerelease,assets,body 2>/dev/null); then
            if node web/scripts/release-version.ts complete --manifest "$RUNNER_TEMP/manifest.json" <<<"$existing"; then
              echo "::notice title=Release kept::GitHub Release $VERSION is already complete; it is left as it is."
            else
              gh release upload "$VERSION" "$RUNNER_TEMP/manifest.json" --clobber
              gh release edit "$VERSION" --draft=false --prerelease --verify-tag \
                --title "$VERSION (test)" --notes-file "$RUNNER_TEMP/notes.md"
              echo "Finished GitHub Release \`$VERSION\` with manifest.json" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            gh release create "$VERSION" "$RUNNER_TEMP/manifest.json" --verify-tag --prerelease \
              --title "$VERSION (test)" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Published GitHub Release \`$VERSION\` with manifest.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Every failure path past the gate ends here: an earlier job failed or was cancelled, or a
      # record step above failed or this job was cancelled.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: always() && (needs.deploy.result != 'success' || failure() || cancelled())
        with:
          workload_identity_provider: ${{ vars.DRYSCOPE_TEST_WIF_PROVIDER }}
          service_account: ${{ vars.DRYSCOPE_TEST_DEPLOY_SA }}
          project_id: dryscope
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: always() && (needs.deploy.result != 'success' || failure() || cancelled())
      - id: failed
        name: Write the failed-release line
        if: always() && (needs.deploy.result != 'success' || failure() || cancelled())
        run: |
          version=null
          if [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[1-9][0-9]{0,5}$ ]]; then version="\"$VERSION\""; fi
          [[ "$RUN_URL" =~ ^https://[A-Za-z0-9./_-]+$ ]] || { echo "::error::Unexpected run URL."; exit 1; }
          line=$(printf '{"env":"test","version":%s,"result":"failed","run":"%s"}' "$version" "$RUN_URL")
          echo "::error title=Test release failed::$line"
          if ! gcloud logging write dryscope-release "$line" --payload-type=json --severity=ERROR --project="$PROJECT"; then
            echo "::error::Could not write the failed-release line to Cloud Logging. The deploy account needs roles/logging.logWriter (docs/plans/TC.md, TC-9)."
            exit 1
          fi
