name: Web app

# Separate from ci.yml so the existing jobs behave exactly as before. Covers only web/ (the
# TypeScript rebuild skeleton); every job has a time limit.
#
# Every pull request runs every job, with no path filter, so `company-isolation` and `check` report
# on each one and can be required checks. Pushes to master keep the path filter.
on:
  push:
    branches: [master]
    paths: ['web/**', 'live-relay-placeholder/**', '.github/workflows/web.yml']
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  # Throwaway Postgres, then migrations from empty. `check` below fails when this job does,
  # so the existing web check cannot pass without it.
  database:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 25
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # npm run test:db starts its own throwaway PostgreSQL 16: the postgres:16 image when a Docker
      # daemon answers (GitHub's Ubuntu image), otherwise initdb/pg_ctl from
      # /usr/lib/postgresql/16/bin. The self-hosted runner's container has neither, so only there
      # this installs the Ubuntu postgresql-16 package, without creating or starting a cluster.
      - name: Install PostgreSQL 16 when there is no Docker daemon
        run: |
          if ! docker version --format '{{.Server.Version}}' > /dev/null 2>&1 &&
            [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo mkdir -p /etc/postgresql-common
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              -o Dpkg::Options::=--force-confold postgresql-16
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:db

  # Firebase Auth and Firestore emulators under a demo- project id only (tests/emu/run.ts
  # refuses any other id). `check` below fails when this job does.
  emulators:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Firestore emulator runs on Java 21 or later.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:emu

  # The company-isolation gate (S3-17): two companies in two tenants, every route called with the
  # other's ids, SQL as the runtime role and the Firestore rules (docs/ACCESS.md, "Company isolation
  # gate"). It also runs inside `database` and `emulators`; this job gives it a check of its own.
  # `check` below fails when this job does, so that check cannot pass without it.
  company-isolation:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 25
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same PostgreSQL 16 setup as the database job, and Java 21 for the Firestore emulator.
      - name: Install PostgreSQL 16 when there is no Docker daemon
        run: |
          if ! docker version --format '{{.Server.Version}}' > /dev/null 2>&1 &&
            [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo mkdir -p /etc/postgresql-common
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              -o Dpkg::Options::=--force-confold postgresql-16
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:isolation

  check:
    needs: [database, emulators, company-isolation]
    if: always() && !cancelled()
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the database job
        run: test "${{ needs.database.result }}" = "success"
      - name: Require the emulator job
        run: test "${{ needs.emulators.result }}" = "success"
      - name: Require the company-isolation job
        run: test "${{ needs.company-isolation.result }}" = "success"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          APP_ENV: test

  e2e:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The job-screen tests (tests/e2e/jobs.spec.ts) start a throwaway PostgreSQL 16 as test:db does:
      # the postgres:16 image when a Docker daemon answers (GitHub's Ubuntu image), otherwise
      # initdb/pg_ctl from /usr/lib/postgresql/16/bin. The self-hosted runner's container has neither, so only there
      # this installs the Ubuntu postgresql-16 package, without creating or starting a cluster.
      - name: Install PostgreSQL 16 when there is no Docker daemon
        run: |
          if ! docker version --format '{{.Server.Version}}' > /dev/null 2>&1 &&
            [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo mkdir -p /etc/postgresql-common
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              -o Dpkg::Options::=--force-confold postgresql-16
          fi
      # The offline tests (tests/e2e/offline) start the Firestore emulator, which needs Java 21 or later.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-results
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7

  # The production image the release workflow (web-release.yml) ships, assembled without Docker by
  # web/scripts/build-image.sh: check its configuration, run its /app tree the way the image does and
  # run the release smoke check against it, so a broken build or start fails here, not at release.
  image:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 20
    env:
      # A release version for this check build only (releases number theirs in web-release.yml); the
      # image must carry it and health must report it, as on a real release.
      CHECK_VERSION: 0000.00.00-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # No Docker daemon on the runner: crane assembles the image (owner decision 2026-11-10).
      - name: Install crane
        run: |
          scripts/install-crane.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Refuse a build without the commit
        run: |
          if scripts/build-image.sh web --output "$RUNNER_TEMP/nocommit.tar" >/dev/null 2>&1; then
            echo "::error::The image built without a commit."; exit 1
          fi
      - name: Build the image without Docker
        run: scripts/build-image.sh web --commit "$GITHUB_SHA" --version "$CHECK_VERSION" --output "$RUNNER_TEMP/web-image.tar" --stage "$RUNNER_TEMP/web-stage"
      - name: Check the image configuration
        run: |
          config=$(tar -xOf "$RUNNER_TEMP/web-image.tar" manifest.json | node scripts/check-image.ts config-path)
          tar -xOf "$RUNNER_TEMP/web-image.tar" "$config" | node scripts/check-image.ts web --commit "$GITHUB_SHA" --version "$CHECK_VERSION"
          echo "image size: $(wc -c < "$RUNNER_TEMP/web-image.tar") bytes"
      # The same /app tree the image carries, started the way the image starts it (node server.js),
      # with what Cloud Run adds (APP_ENV) and nothing else from this runner's environment.
      # Request tracing (docs/plans/TC.md, TC-3) starts with it, recording spans in the process and
      # exporting nothing (no K_SERVICE, no project): the log must say tracing started in that mode
      # and never that it could not start.
      - name: Run as on Cloud Run and smoke-check
        run: |
          (cd "$RUNNER_TEMP/web-stage/app" && env -i PATH="$PATH" NODE_ENV=production PORT=8080 \
            HOSTNAME=127.0.0.1 APP_ENV=test APP_COMMIT="$GITHUB_SHA" APP_VERSION="$CHECK_VERSION" node server.js > "$RUNNER_TEMP/web.log" 2>&1 &)
          node scripts/smoke-release.ts --url http://127.0.0.1:8080 --commit "$GITHUB_SHA" --version "$CHECK_VERSION" --env test \
            || { cat "$RUNNER_TEMP/web.log"; exit 1; }
          grep -q '"message":"tracing started".*"code":"spans"' "$RUNNER_TEMP/web.log" \
            || { echo "::error::Tracing did not start."; cat "$RUNNER_TEMP/web.log"; exit 1; }
          if grep -q 'tracing unavailable' "$RUNNER_TEMP/web.log"; then
            echo "::error::Tracing failed to start."; cat "$RUNNER_TEMP/web.log"; exit 1
          fi
      - name: Refuse to start without APP_ENV
        run: |
          status=0
          (cd "$RUNNER_TEMP/web-stage/app" && env -i PATH="$PATH" PORT=8090 timeout 60 node server.js) >/dev/null 2>&1 || status=$?
          test "$status" = 1
      - name: Live relay placeholder answers 503
        run: |
          scripts/build-image.sh live-placeholder --output "$RUNNER_TEMP/live-image.tar" --stage "$RUNNER_TEMP/live-stage"
          config=$(tar -xOf "$RUNNER_TEMP/live-image.tar" manifest.json | node scripts/check-image.ts config-path)
          tar -xOf "$RUNNER_TEMP/live-image.tar" "$config" | node scripts/check-image.ts live-placeholder
          (cd "$RUNNER_TEMP/live-stage/app" && env -i PATH="$PATH" PORT=8081 node server.js > /dev/null 2>&1 &)
          for _ in $(seq 1 20); do
            if node -e "fetch('http://127.0.0.1:8081/').then((r) => process.exit(r.status === 503 ? 0 : 3)).catch(() => process.exit(2))"; then exit 0; fi
            sleep 1
          done
          echo "::error::The placeholder did not answer 503."; exit 1
