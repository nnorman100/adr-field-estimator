name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # backend/Dockerfile is the single source of the Python version.
      - id: python
        run: echo "version=$(python3 scripts/ci_python_version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Some tests run node. GitHub's Ubuntu image has it; the self-hosted runner's container does not.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pip install --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest tests -q -p no:cacheprovider
      - run: python -m ruff format --check .
      - run: python -m ruff check .

  firestore-emulator:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 15
    env:
      ADR_FIRESTORE_EMULATOR_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # backend/Dockerfile is the single source of the Python version.
      - id: python
        run: echo "version=$(python3 scripts/ci_python_version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # The Firestore emulator runs on Java 21 or later.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pip install --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt
      # firebase-tools' emulators:exec starts the emulator, sets FIRESTORE_EMULATOR_HOST for the
      # tests and stops it afterwards; it stays out of package.json so other jobs do not install it.
      # The demo- project ID keeps everything offline.
      - run: >-
          npx --yes firebase-tools@15.31.0 emulators:exec --only firestore --project demo-adr-emulator
          "python -m pytest tests/test_firestore_emulator*.py -q -p no:cacheprovider"

  node:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  browser:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 90
    env:
      ADR_BROWSER_PORT: '8876'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # browser is a required check on every PR and push to master, so keep the job and skip its
      # steps when a PR or push touches no files the legacy app or its Playwright suite depends on.
      # When the base/before commit is unavailable (such as a new branch or force push), run the
      # full suite.
      - name: Check whether legacy browser files changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit ${BASE_SHA:-<empty>} is unavailable; running legacy browser suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ] && ! git merge-base --is-ancestor "$BASE_SHA" HEAD 2>/dev/null; then
            echo "Push base ${BASE_SHA} is not an ancestor of HEAD; running legacy browser suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed="$(git diff --no-renames --name-only "$BASE_SHA...HEAD" -- \
            .github/workflows/ci.yml \
            backend/ \
            public/ \
            index.html \
            tests/browser/ \
            tests/browser_server.py \
            tests/browser-auth.js \
            tests/fakes.py \
            tests/__init__.py \
            ':(glob)playwright*.config.js' \
            package.json \
            package-lock.json \
            firebase.json \
            .firebaserc \
            firestore.rules \
            firestore.indexes.json \
            scripts/artifact-paths.js \
            scripts/ci_python_version.py \
            scripts/manual_chrome.js \
            scripts/verify_routing.js)"; then
            echo "Could not diff against ${BASE_SHA}; running legacy browser suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$changed" ]; then
            echo "Skipping legacy browser suite: no legacy app or browser-test files changed against ${BASE_SHA}."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Running legacy browser suite because relevant files changed:"
          echo "$changed"
          echo "run=true" >> "$GITHUB_OUTPUT"
      # backend/Dockerfile is the single source of the Python version.
      - id: python
        if: steps.scope.outputs.run == 'true'
        run: echo "version=$(python3 scripts/ci_python_version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: lts/*
          cache: npm
      - id: playwright-version
        if: steps.scope.outputs.run == 'true'
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.scope.outputs.run == 'true'
        run: pip install --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: Install Playwright system deps and browsers
        if: steps.scope.outputs.run == 'true'
        run: |
          retry() {
            local attempt=1
            local max_attempts=3
            local delay=10
            while [ "$attempt" -le "$max_attempts" ]; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt} failed, retrying in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }
          retry npx playwright install-deps chromium webkit
          retry npx playwright install chromium webkit
      - if: steps.scope.outputs.run == 'true'
        run: npm run test:browser -- --config=playwright.isolated.config.js
        env:
          ADR_BROWSER_ARTIFACTS: ${{ runner.temp }}/adr-browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: browser-results
          path: ${{ runner.temp }}/adr-browser
          retention-days: 14

  audit:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # Audits the hash-locked files as written; nothing is resolved or installed from them.
      # To accept a false positive or an unfixable advisory, add `--ignore-vuln <ID>` to the
      # pip-audit commands with a comment giving the reason and date (see README.md).
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements.txt
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements-dev.txt
      - run: npm audit --audit-level=high
