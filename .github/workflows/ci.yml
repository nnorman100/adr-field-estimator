name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# The legacy app's tests (the Python suite, the Playwright browser suite and the Firestore emulator
# tests) are retired from CI as of 2026-11-10. The legacy app is deleted in S8 and nothing changes
# it until then, so those jobs (python, browser, firestore-emulator) were removed; the owner takes
# them off the master ruleset's required checks. node keeps the repo-wide lint, format and vitest
# checks the rebuild depends on. See docs/runbook/ci.md, "Legacy CI retired".
jobs:
  node:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # ESLint and Prettier also cover the rebuild's JavaScript (infra/dryscope/scripts), and the
      # required-docs and file-length checks apply to every PR, web/ included.
      - run: npm run format:check
      - run: npm run lint
      # The vitest suite holds the rebuild's Terraform plan check. The legacy unit tests that the
      # rest of `npm test` runs are retired from CI.
      - run: npx vitest run

  audit:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # Audits the hash-locked files as written; nothing is resolved or installed from them.
      # To accept a false positive or an unfixable advisory, add `--ignore-vuln <ID>` to the
      # pip-audit commands with a comment giving the reason and date (see README.md).
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements.txt
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements-dev.txt
      - run: npm audit --audit-level=high
