name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# The legacy app (backend/, public/, tests/ and their tooling) is retired from CI as of 2026-11-10;
# it is deleted in S8 and nothing changes it until then. Master's ruleset still requires the job
# names python, browser, firestore-emulator and node, so each stays and reports. python keeps only
# the pricing-oracle tests, which hold the legacy pricing answers the TypeScript rebuild must match
# until S4 is finished; browser and firestore-emulator report a quick success. See docs/RUNBOOK.md,
# "Legacy CI retired".
jobs:
  python:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    steps:
      # The oracle's manifest check reads git (the pinned backend commit), so keep full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # backend/Dockerfile is the single source of the Python version.
      - id: python
        run: echo "version=$(python3 scripts/ci_python_version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest tests/test_pricing_oracle.py -q -p no:cacheprovider

  firestore-emulator:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    steps:
      - name: Legacy Firestore emulator tests retired
        run: echo "legacy suite retired 2026-11-10; see docs/RUNBOOK.md"

  node:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # ESLint and Prettier also cover the rebuild's JavaScript (infra/dryscope/scripts), and the
      # required-docs and file-length checks apply to every PR, web/ included.
      - run: npm run format:check
      - run: npm run lint
      # The vitest suite holds the rebuild's Terraform plan check. The legacy unit tests that the
      # rest of `npm test` runs are retired from CI.
      - run: npx vitest run

  browser:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    steps:
      - name: Legacy browser suite retired
        run: echo "legacy suite retired 2026-11-10; see docs/RUNBOOK.md"

  audit:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # Audits the hash-locked files as written; nothing is resolved or installed from them.
      # To accept a false positive or an unfixable advisory, add `--ignore-vuln <ID>` to the
      # pip-audit commands with a comment giving the reason and date (see README.md).
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements.txt
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements-dev.txt
      - run: npm audit --audit-level=high
