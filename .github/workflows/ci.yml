name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# The legacy app's tests (the Python suite, the Playwright browser suite and the Firestore emulator
# tests) are retired from CI as of 2026-11-10. The legacy app is deleted in S8 and nothing changes
# it until then, so those jobs (python, browser, firestore-emulator) were removed; the owner takes
# them off the master ruleset's required checks. node keeps the repo-wide lint, format and vitest
# checks the rebuild depends on. See docs/runbook/ci.md, "Legacy CI retired".
jobs:
  node:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    # About 1.5 minutes in recent runs; the limit leaves room for a loaded host.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # ESLint and Prettier also cover the rebuild's JavaScript (infra/dryscope/scripts), and the
      # required-docs and file-length checks apply to every PR, web/ included.
      - run: npm run format:check
      - run: npm run lint
      # The vitest suite holds the rebuild's Terraform plan check. The legacy unit tests that the
      # rest of `npm test` runs are retired from CI.
      - run: npx vitest run

  audit:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # Fails on any high or critical advisory except the owner-approved ones in
      # .github/audit-exceptions.json, and prints every one it skips.
      - run: node scripts/audit-check.mjs

  # Offline Terraform checks for infra/dryscope (owner decision 3a, 2026-11-19): infra/dryscope/scripts/check.sh
  # runs terraform fmt and validate, the mocked `terraform test` suites, the plan check over every mocked
  # plan and the destroy guards, and fails when a fresh app plan differs from the committed fixtures in
  # infra/dryscope/fixtures/. It uses mock providers and `init -backend=false`: no cloud credentials, no
  # real plan or apply. A pull request that changes nothing under infra/ or this file reports success
  # after the first step; pushes to master always run in full.
  terraform:
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 20
    env:
      TF_VERSION: 1.12.2
      # SHA-256 of terraform_1.12.2_linux_amd64.zip, from HashiCorp's signed
      # terraform_1.12.2_SHA256SUMS (https://releases.hashicorp.com/terraform/1.12.2/). Pinned here so a
      # changed download fails instead of trusting a checksum file fetched from the same server.
      TF_SHA256: 1eaed12ca41fcfe094da3d76a7e9aa0639ad3409c43be0103ee9f5a1ff4b7437
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Skip pull requests that change nothing under infra
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
            git diff --quiet HEAD^1 HEAD -- infra .github/workflows/ci.yml; then
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This pull request changes nothing under infra/ or ci.yml; skipping."
          else
            echo "infra=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.infra == 'true'
        with:
          node-version: lts/*
      - name: Install Terraform with a pinned checksum
        if: steps.changes.outputs.infra == 'true'
        run: |
          zip="terraform_${TF_VERSION}_linux_amd64.zip"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/${zip}"
          echo "${TF_SHA256}  ${zip}" | sha256sum --check --strict
          mkdir -p tf-bin
          unzip -o -q "$zip" -d tf-bin
          echo "TERRAFORM=$RUNNER_TEMP/tf-bin/terraform" >> "$GITHUB_ENV"
      - name: Offline Terraform checks
        if: steps.changes.outputs.infra == 'true'
        run: infra/dryscope/scripts/check.sh
