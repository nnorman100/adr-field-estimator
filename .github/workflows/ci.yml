name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: python -m pytest tests -q -p no:cacheprovider

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADR_BROWSER_PORT: '8876'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --config=playwright.isolated.config.js
        env:
          ADR_BROWSER_ARTIFACTS: ${{ runner.temp }}/adr-browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: ${{ runner.temp }}/adr-browser
          retention-days: 14
