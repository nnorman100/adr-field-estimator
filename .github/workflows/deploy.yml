name: Deploy

# Legacy deployment is manual-only; automatic deployment is disabled.
# Setup and owner instructions: docs/firebase-isolation.md.
#
# workflow_dispatch with version blank runs the same refusal checks with nothing staged or deployed,
# to prove the setup. With version set, it rolls production back to that version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional YYYY.MM.DD-N version tag to roll back to (leave blank for check-only preflight)'
        required: false
        type: string
      confirm_past_migration:
        description: 'Choose yes to roll back past a data migration or a rules or index change'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']
      confirm_baseline:
        description: 'Choose yes to roll back with a repository baseline that turns off a feature now serving'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']

permissions:
  contents: read

jobs:
  deploy:
    # AUTO_DEPLOY_ENABLED must be true for a manual dispatch to run.
    if: >-
      vars.AUTO_DEPLOY_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ${{ vars.CI_RUNNER || 'dryscope-linux' }}
    timeout-minutes: 60
    # One release at a time. A newer merge waits for the running one and replaces any older waiting
    # run; the script skips a commit that is not newer than what is serving.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      RUN_ID: ${{ github.run_id }}
      DEPLOY_ARGS: ${{ github.event_name == 'workflow_dispatch' && '--check-only' || '' }}
      ROLLBACK_VERSION: ${{ inputs.version || '' }}
      CONFIRM_ARGS: ${{ format('{0} {1}', inputs.confirm_past_migration == 'yes' && '--confirm-past-migration' || '', inputs.confirm_baseline == 'yes' && '--confirm-baseline' || '') }}
    steps:
      # Deploy the commit CI tested, not whatever master has moved to since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # backend/Dockerfile is the single source of the Python version.
      - id: python
        run: echo "version=$(python3 scripts/ci_python_version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # The TTL check imports the shared verifier helpers, which use the backend's dependencies.
      - run: pip install --require-hashes -r backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      # scripts/verify_hosting.js drives Chromium against the deployed site.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: alert-disaster-field-2026
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # scripts/auto_deploy.py and the publish step run gh. GitHub's Ubuntu image has it; the
      # self-hosted runner's container does not, so install a pinned, checksum-checked release.
      - name: Install GitHub CLI
        env:
          GH_VERSION: 2.103.2
          GH_SHA256: 62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8
        run: |
          if ! command -v gh > /dev/null; then
            archive="$RUNNER_TEMP/gh.tar.gz"
            curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
            echo "${GH_SHA256}  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          fi
      - name: Release
        if: ${{ !inputs.version }}
        # DEPLOY_ARGS is deliberately unquoted: empty means no argument.
        run: python3 scripts/auto_deploy.py --commit "$COMMIT" --run-id "$RUN_ID" $DEPLOY_ARGS
      # The only step with a GitHub write token; no third-party install or deploy tool runs here.
      - name: Publish version
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 scripts/auto_deploy.py --publish "$COMMIT"
      - name: Roll back to version
        if: ${{ inputs.version != '' }}
        # CONFIRM_ARGS is deliberately unquoted: empty means no argument.
        run: python3 scripts/auto_deploy.py --rollback "$ROLLBACK_VERSION" --run-id "$RUN_ID" $CONFIRM_ARGS
