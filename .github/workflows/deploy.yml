name: Deploy

# Releases a master commit to production after its CI run succeeds, using the manual release path
# (scripts/auto_deploy.py): stage a tagged 0% revision, run the staged checks, promote, deploy only
# hosting:alert-disaster, verify, and roll back automatically if verification fails. It never deploys
# Firestore rules or indexes; a merge that changes them stops here for a hand release. The release
# record is this run's job summary. Setup and the one-time owner steps: docs/firebase-isolation.md,
# "Automatic deploys".
#
# workflow_dispatch runs the same refusal checks with nothing staged or deployed, to prove the setup.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # AUTO_DEPLOY_ENABLED is a repository variable the owner sets to 'true' after the one-time setup;
    # set it to anything else to pause automatic deploys. Only a successful CI push run on master
    # in this repository qualifies; pull request runs never deploy.
    if: >-
      vars.AUTO_DEPLOY_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One release at a time. A newer merge waits for the running one and replaces any older waiting
    # run; the script skips a commit that is not newer than what is serving.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      RUN_ID: ${{ github.run_id }}
      DEPLOY_ARGS: ${{ github.event_name == 'workflow_dispatch' && '--check-only' || '' }}
    steps:
      # Deploy the commit CI tested, not whatever master has moved to since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # backend/Dockerfile is the single source of the Python version.
      - id: python
        run: echo "version=$(python3 scripts/ci_python_version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # The TTL check imports the shared verifier helpers, which use the backend's dependencies.
      - run: pip install --require-hashes -r backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      # scripts/verify_hosting.js drives Chromium against the deployed site.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: alert-disaster-field-2026
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Release
        # DEPLOY_ARGS is deliberately unquoted: empty means no argument.
        run: python3 scripts/auto_deploy.py --commit "$COMMIT" --run-id "$RUN_ID" $DEPLOY_ARGS
