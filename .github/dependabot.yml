version: 2
updates:
  # Major updates for the dependencies listed under each ignore below are held
  # until a stage plans for them, so they do not sit failing in the merge line.
  # When another major update sits failing, add its dependency to that entry's
  # ignore list. All other major updates still open, including security fixes.

  # Weekly on Monday: npm for the TypeScript web app in web/. Minor and patch
  # updates share one pull request; each major update gets its own pull request,
  # except TypeScript majors, which are held.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Held 2026-11-17: these OpenTelemetry versions need @opentelemetry/api
      # 1.10, but @opentelemetry/sdk-trace-node 2.12.0 (the latest release)
      # only accepts api below 1.10, so npm ci fails (Dependabot PRs 416, 418).
      # Revisit when sdk-trace-node publishes a 3.x release; then remove these
      # entries and bump api, exporter, resources and sdk-trace-node together.
      - dependency-name: '@opentelemetry/api'
        versions: ['>= 1.10.0']
      - dependency-name: '@opentelemetry/exporter-trace-otlp-proto'
        versions: ['>= 0.300.0']
      - dependency-name: '@opentelemetry/resources'
        versions: ['>= 3.0.0']

  # Monthly (Dependabot runs monthly updates on the 1st): Terraform providers and
  # modules for each stack. All updates for a stack share one pull request,
  # except Google provider (hashicorp/google) majors, which are held.
  - package-ecosystem: terraform
    directory: /infra/dryscope/data
    schedule:
      interval: monthly
    groups:
      terraform-data:
        patterns: ['*']
    ignore:
      - dependency-name: hashicorp/google
        update-types: ['version-update:semver-major']

  - package-ecosystem: terraform
    directory: /infra/dryscope/app
    schedule:
      interval: monthly
    groups:
      terraform-app:
        patterns: ['*']
    ignore:
      - dependency-name: hashicorp/google
        update-types: ['version-update:semver-major']

  # Monthly: GitHub Actions versions used by .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Weekly on Monday: the base image pin in web/Dockerfile, shared by the web app and Live placeholder images.
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-docker-minor-patch:
        update-types: [minor, patch]
