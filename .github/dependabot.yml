version: 2
updates:
  # Weekly on Monday: npm for the TypeScript web app in web/. Minor and patch
  # updates share one pull request; each major update gets its own pull request.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-npm-minor-patch:
        update-types: [minor, patch]

  # Monthly (Dependabot runs monthly updates on the 1st): Terraform providers and
  # modules for each stack. All updates for a stack share one pull request.
  - package-ecosystem: terraform
    directory: /infra/dryscope/data
    schedule:
      interval: monthly
    groups:
      terraform-data:
        patterns: ['*']

  - package-ecosystem: terraform
    directory: /infra/dryscope/app
    schedule:
      interval: monthly
    groups:
      terraform-app:
        patterns: ['*']

  # Monthly: GitHub Actions versions used by .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
