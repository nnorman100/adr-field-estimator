version: 2
updates:
  # Weekly on Monday: npm for the TypeScript web app in web/. Minor and patch
  # updates share one pull request; each major update gets its own pull request,
  # except TypeScript, whose major updates are ignored until a stage plans for
  # them (TypeScript 7).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # Monthly (Dependabot runs monthly updates on the 1st): Terraform providers and
  # modules for each stack. All updates for a stack share one pull request. Major
  # updates of the Google provider are ignored until a stage plans for them (v8).
  - package-ecosystem: terraform
    directory: /infra/dryscope/data
    schedule:
      interval: monthly
    groups:
      terraform-data:
        patterns: ['*']
    ignore:
      - dependency-name: hashicorp/google
        update-types: ['version-update:semver-major']

  - package-ecosystem: terraform
    directory: /infra/dryscope/app
    schedule:
      interval: monthly
    groups:
      terraform-app:
        patterns: ['*']
    ignore:
      - dependency-name: hashicorp/google
        update-types: ['version-update:semver-major']

  # Monthly: GitHub Actions versions used by .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Weekly on Monday: the base image pin in web/Dockerfile, shared by the web app and Live placeholder images.
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-docker-minor-patch:
        update-types: [minor, patch]
