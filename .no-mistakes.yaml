# Repo-level no-mistakes settings. Schema: no-mistakes "Repo Config Reference".
# The review agent (codex) and the fixer are global-only (review_agents in the
# global config), so they are not set here.

# Automatic commits must leave these for a person: workflow files, the
# instruction files, and the test guard script and its config. A match parks the
# step at an approval gate even under unattended runs. Trusted-only: honored from
# the default-branch copy of this file.
protected_paths:
  - ".github/workflows/**"
  - ".github/test-guard.json"
  - "CLAUDE.md"
  - "AGENTS.md"
  - "scripts/test-guard.mjs"
  # Tests, eval fixtures and the configs that set test timeouts or retries. The
  # project rule is that tests are never weakened and a test change needs the
  # owner; a pipeline auto-fix must park here instead of editing them. This only
  # guards automatic commits, not commits a person or worker authored.
  - "tests/**"
  - "web/tests/**"
  - "infra/dryscope/fixtures/**"
  - "infra/dryscope/**/guards/**"
  - "playwright.config.js"
  - "playwright.isolated.config.js"
  - "vitest.config.mjs"
  - "web/playwright.config.ts"
  - "web/vitest.config.ts"
  - "web/vitest.db.config.ts"
  - "web/vitest.emu.config.ts"

# Review findings get up to two automatic fix rounds (the built-in default is 0,
# which parks every finding for a person). Matches the global setting.
auto_fix:
  review: 2

# The pipeline's Test step runs lint, type check, unit tests and the emulator
# suite. GitHub CI is still the official gate: database, end-to-end, build, test
# guard and CodeQL run only there. Read only from the default-branch copy of this
# file, so a change here takes effect after it merges.
commands:
  # The run worktree starts with tracked files only, so install both packages.
  prepare: "npm ci --prefer-offline && npm --prefix web ci --prefer-offline"
  # Root lint and vitest, then web type check, lint, unit tests and the Firebase
  # emulator suite (demo- project only, needs Java 21+, takes a few minutes). Only test:emu gets
  # EMU_PORTS=auto (free emulator ports per run, so concurrent runs never collide); the unit
  # step must see the defaults.
  test: "npm run lint && npx vitest run && npm --prefix web run typecheck && npm --prefix web run lint && npm --prefix web test && EMU_PORTS=auto npm --prefix web run test:emu"

test:
  instructions: |
    Testing in the pipeline: the local test run is exactly `npm run lint`,
    `npx vitest run`, `npm --prefix web run typecheck`, `npm --prefix web run
    lint`, `npm --prefix web test` (unit) and `EMU_PORTS=auto npm --prefix web
    run test:emu` (Firebase emulators on free ports). Do not run `npm run test:db`, `npm run test:e2e`,
    `npm run test:browser`, `npm run build`, the root Firestore emulator suites
    or the full pytest run; do not start a database container or Playwright.
    GitHub CI runs the database, emulator, unit, end-to-end and build suites and
    is the official gate. A scenario whose evidence is one of those CI suites is
    recorded as covered by that suite, not as inconclusive: do not escalate it or
    ask for a decision, and name the covering suite in the result.
